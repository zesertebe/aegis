[package]
name = "aegis"
version = "0.1.0"
edition = "2021"
description = "Gestor TUI de bovedas cifradas sobre restic"
license = "GPL-3.0-only"
repository = "https://github.com/zesertebe/aegis"
readme = "README.md"
keywords = ["restic", "backup", "tui", "vault", "cli"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
